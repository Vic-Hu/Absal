// ---------- áudio ----------
let actx, master, reverb, noiseBuf;
function audio() {   // contexto único: compressor no master + reverb curto para dar corpo aos disparos
  if (actx) return actx;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createDynamicsCompressor();
  master.threshold.value = -14; master.ratio.value = 6; master.attack.value = 0.002; master.release.value = 0.15;
  master.connect(actx.destination);
  const len = Math.floor(actx.sampleRate * 0.6), imp = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = imp.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  reverb = actx.createConvolver(); reverb.buffer = imp;
  const wet = actx.createGain(); wet.gain.value = 0.6;
  reverb.connect(wet); wet.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  return actx;
}
function out(node, wet) {
  node.connect(master);
  if (wet) { const s = actx.createGain(); s.gain.value = wet; node.connect(s); s.connect(reverb); }
}
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0, delay = 0, wet = 0) {
  if (!soundOn) return;
  try {
    audio();
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); out(g, wet);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
// rajada de ruído filtrado (estalo, estilhaço, fumaça de tiro)
function noise(dur, vol, type = 'lowpass', f0 = 4000, f1 = f0, q = 0.8, delay = 0, wet = 0) {
  if (!soundOn) return;
  try {
    audio();
    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); out(g, wet);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
  } catch (e) {}
}
// pistola: transiente + estalo + corpo + sub-grave + eco de ambiente + cápsula caindo no chão
function sfxShot() {
  const v = 0.92 + Math.random() * 0.16;   // leve variação a cada tiro
  noise(0.012, 0.32, 'highpass', 2500, 2500, 0.5);                                    // transiente: o "clique" do disparo
  noise(0.09, 0.34, 'bandpass', 3800 * v, 900, 0.6, 0, 0.3);                          // estalo da pólvora
  noise(0.22, 0.3, 'lowpass', 2600 * v, 180, 0.8, 0.004, 0.45);                       // corpo / estrondo
  beep(420 * v, 0.07, 'sawtooth', 0.14, -330, 0.002);                                 // "latido" médio
  beep(140 * v, 0.28, 'sine', 0.5, -105, 0, 0.25);                                    // soco grave
  beep(62, 0.35, 'sine', 0.3, -28, 0.005);                                            // sub
  noise(0.35, 0.09, 'lowpass', 1800, 250, 0.7, 0.05, 0.8);                            // reflexo do ambiente
  noise(0.2, 0.05, 'lowpass', 1400, 200, 0.7, 0.11, 0.8);                             // segundo eco, mais fraco
  const d = 0.3 + Math.random() * 0.12;                                               // cápsula quicando no chão
  beep(4300 * v, 0.07, 'sine', 0.045, -600, d);
  beep(5600 * v, 0.05, 'sine', 0.03, -500, d + 0.06);
  beep(4700 * v, 0.04, 'sine', 0.015, -300, d + 0.11);
}
// giro do revólver: sopro de vento que sobe de tom
function sfxSpin() {

}
// minigun: tiros curtos, com leve variação de tom para não soar repetitivo
function sfxMini() {

  beep(130 + Math.random() * 40, 0.08, 'sine', 0.2, -90);
  if (Math.random() < 0.3) noise(0.02, 0.06, 'highpass', 4000);
}
// caixa quebrando: estalo, madeira rachando, tábuas batendo e um toque especial por tipo
function sfxBreak(type) {
  noise(0.2, 0.26, 'bandpass', 2400, 600, 0.9, 0, 0.12);
  noise(0.05, 0.16, 'highpass', 4200, 4200, 0.7);
  beep(125, 0.2, 'sine', 0.3, -80);
  for (let i = 0; i < 5; i++) {
    const d = 0.03 + i * 0.035 + Math.random() * 0.02;
    beep(220 + Math.random() * 520, 0.07, 'triangle', 0.11, -120, d);
    noise(0.035, 0.09, 'bandpass', 1400 + Math.random() * 1800, 1000, 3, d);
  }
  if (type === 'gold') [1568, 2093, 2637].forEach((f, i) => beep(f, 0.3, 'sine', 0.06, 0, 0.05 + i * 0.06, 0.3));
  else if (type === 'bolt') { noise(0.28, 0.14, 'bandpass', 4000, 900, 1.5); beep(1900, 0.22, 'sawtooth', 0.05, -1600); }
  else if (type === 'minigun') { beep(330, 0.35, 'sawtooth', 0.06, 550, 0.02, 0.3); beep(660, 0.45, 'sine', 0.07, 0, 0.1, 0.4); }
}

// ---------- jogo ----------
function reset() {
  boxes = []; bullets = []; parts = []; floaters = [];
  score = 0; shownScore = 0; lives = 5; level = 1; combo = 0; kills = 0;
  spawnTimer = 0.5; shootCd = 0; shake = 0; boom = 0;
  ammo = MAX_AMMO; runCoins = 0;
  mini = 0; intro = 0; spin = 0;
}

function spawnBox() {
  const r = Math.random();
  let type = r < 0.12 ? 'bomb' : r < 0.18 ? 'bolt' : r < 0.195 ? 'minigun' : r < 0.295 ? 'gold' : 'normal';
  if (type === 'minigun' && (mini > 0 || intro > 0 || boxes.some(b => b.type === 'minigun'))) type = 'normal';   // uma de cada vez, e nunca com a minigun na mão
  const size = type === 'gold' ? 40 : 48 + Math.random() * 18;
  const lo = side > 0 ? SAFE_X : 70, hi = side > 0 ? W - 70 : W - SAFE_X;
  const x = lo + size * 0.7 + Math.random() * (hi - lo - size * 0.7);
  const apex = 140 + Math.random() * 330;          // altura do pico
  const vy = -Math.sqrt(2 * BOX_GRAVITY * apex);
  const speedMul = 1 + (level - 1) * 0.05;
  const vx = (Math.random() - 0.5) * 140;
  boxes.push({
    x, y: H + size, vx, vy: vy * Math.min(speedMul, 1.12), size, type,
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, hit: false
  });
}

function burst(x, y, color, n = 14, speed = 320) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * speed;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
      life: 0.5 + Math.random() * 0.5, max: 1, size: 3 + Math.random() * 6,
      color, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12 });
  }
}

function floatText(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}

let mini = 0, intro = 0;   // balas da minigun e tempo da cena de entrada
const MINI_AMMO = 100, INTRO_TIME = 2.4;
const smooth = x => x * x * (3 - 2 * x);
let comboPop = 0;              // pulso do contador de combo a cada acerto seguido
let shownScore = 0;            // pontuação exibida: sobe de 1 em 1 até alcançar a real
let bgHue = 228;               // matiz do fundo: muda conforme a pontuação
let boom = 0, boomRGB = '255,200,120';   // clarão da explosão (0..1) e sua cor
let flash = 0, flashRot = 0;
const FLASH_TIME = 0.08;
function muzzlePos() {
  return {
    x: GUN.x + Math.cos(aim) * muzzleLen() + side * MUZZLE_Y * Math.sin(aim),
    y: gunY() + Math.sin(aim) * muzzleLen() - side * MUZZLE_Y * Math.cos(aim),
  };
}

// minigun: rajada rápida, leve dispersão, sem recarga; acabou, volta à pistola
function shootMini() {
  mini--;
  shootCd = 0.05;
  const a = aim + (Math.random() - 0.5) * 0.07;
  const { x: mx, y: my } = muzzlePos();
  recoil = 7;
  bullets.push({ x: mx, y: my, px: mx, py: my, sx: mx, sy: my, vx: Math.cos(a) * 3200, vy: Math.sin(a) * 3200 });
  flash = FLASH_TIME; flashRot = Math.random() * 6;
  for (let i = 0; i < 4; i++) {
    const b = aim + (Math.random() - 0.5) * 0.6, sp = 400 + Math.random() * 600, l = 0.1 + Math.random() * 0.15;
    parts.push({ kind: 'spark', x: mx, y: my, vx: Math.cos(b) * sp, vy: Math.sin(b) * sp,
      life: l, max: l, size: 2 + Math.random() * 2, color: Math.random() < 0.5 ? '#fff3b0' : '#ffb347', rot: 0, vr: 0 });
  }
  if (Math.random() < 0.4) parts.push({ x: GUN.x, y: gunY() - 6, vx: side * (-80 - Math.random() * 80), vy: -240 - Math.random() * 100,
    life: 0.8, max: 0.8, size: 4, color: '#e0b84a', rot: 0, vr: 14 });
  sfxMini();
  shake = Math.max(shake, 2.5);
  if (mini <= 0) {
    floatText(GUN.x + 110 * side, gunY() - 60, T().miniOff, '#ff9f43');
    beep(120, 0.3, 'square', 0.06, -60);
  }
}
// caixa minigun atingida: a tela se afasta e a minigun aparece
function grantMinigun() {
  mini = MINI_AMMO; intro = INTRO_TIME; spin = 0; held = false; shootCd = 0.3;
  shake = Math.max(shake, 8);
  [440, 554, 659, 880, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.07), i * 110));
  setTimeout(() => beep(70, 0.9, 'sawtooth', 0.1, -20), 300);
}

function shoot() {
  if (state !== 'play' || shootCd > 0 || intro > 0) return;
  if (mini > 0) { shootMini(); return; }
  if (ammo <= 0) { shootCd = 0.25; beep(90, 0.05, 'square', 0.05); noise(0.03, 0.1, 'bandpass', 2500, 2500, 2); return; }
  ammo--;
  shootCd = 0.16;
  if (equipped === 'revolver') { spin = SPIN_TIME; shootCd = SPIN_TIME; sfxSpin(); }   // cambalhota: o próximo tiro espera ela terminar
  const { x: mx, y: my } = muzzlePos();
  recoil = 12;
  bullets.push({ x: mx, y: my, px: mx, py: my, sx: mx, sy: my, vx: Math.cos(aim) * 3000, vy: Math.sin(aim) * 3000 });

  // clarão + faíscas em cone + fumaça + cápsula ejetada
  flash = FLASH_TIME; flashRot = Math.random() * 6;
  for (let i = 0; i < 12; i++) {
    const a = aim + (Math.random() - 0.5) * 0.7, sp = 400 + Math.random() * 700, l = 0.12 + Math.random() * 0.2;
    parts.push({ kind: 'spark', x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: l, max: l, size: 2 + Math.random() * 2, color: Math.random() < 0.5 ? '#fff3b0' : '#ffb347', rot: 0, vr: 0 });
  }
  for (let i = 0; i < 5; i++) {
    const a = aim + (Math.random() - 0.5) * 0.9, sp = 40 + Math.random() * 120, l = 0.5 + Math.random() * 0.4;
    parts.push({ kind: 'smoke', x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
      life: l, max: l, size: 5 + Math.random() * 5, color: '#cfd3e6', rot: 0, vr: 0 });
  }
  const g = gunY();
  parts.push({ x: GUN.x, y: g - 4, vx: side * (-60 - Math.random() * 60), vy: -260 - Math.random() * 80,
    life: 0.9, max: 0.9, size: 4, color: '#e0b84a', rot: 0, vr: 14 });

  sfxShot();
  shake = Math.max(shake, 3);
}

function loseLife(x, y) {
  lives--; combo = 0; shake = Math.max(shake, 10);
  floatText(x, y, '-1 ♥', '#ff5d6c');
  beep(110, 0.35, 'sawtooth', 0.09, -60);
  if (lives <= 0) endGame();
}
function endGame() {
  state = 'over'; held = false;
  if (score > best) { best = score; try { localStorage.setItem('stb_best', best); } catch (e) {} }
}

function update(dt) {
  // mira
  const rel = Math.max(-1.35, Math.min(1.35, Math.atan2(mouse.y - gunY(), (mouse.x - GUN.x) * side)));
  aim = side > 0 ? rel : Math.PI - rel;
  shootCd -= dt;
  spin = Math.max(0, spin - dt);
  const gdt = intro > 0 ? 0 : dt;   // durante a cena da minigun o jogo fica parado
  if (intro > 0) intro = Math.max(0, intro - dt);
  const gap = score - shownScore;
  if (gap > 0) shownScore = Math.min(score, shownScore + Math.max(12, gap * 4) * dt);   // longe = rápido, perto = devagar
  else shownScore = score;
  bgHue += (228 + score * 0.6 - bgHue) * Math.min(1, 3 * dt);   // transição suave
  if (held) shoot();
  shake = Math.max(0, shake - 30 * dt);

  if (state === 'play') {
    level = 1 + Math.floor(kills / 10);
    spawnTimer -= gdt;
    if (spawnTimer <= 0) {
      const n = Math.random() < Math.min(0.15 + level * 0.05, 0.45) ? 2 : 1;
      for (let i = 0; i < n; i++) spawnBox();
      spawnTimer = Math.max(0.55, 1.5 - level * 0.08) + Math.random() * 0.4;
    }
  }

  if (state === 'menu' || state === 'help' || state === 'settings' || state === 'shop') {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnBox(); spawnTimer = 0.9 + Math.random() * 0.6; }
  }

  // balas
  for (const b of bullets) {
    b.px = b.x; b.py = b.y;
    b.x += b.vx * gdt; b.y += b.vy * gdt;
  }
  bullets = bullets.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20 && !b.dead);

  // caixas
  for (const bx of boxes) {
    bx.vy += BOX_GRAVITY * (bx.vy > 0 ? FALL_MUL : 1) * gdt;
    bx.x += bx.vx * gdt; bx.y += bx.vy * gdt; bx.rot += bx.vr * gdt;
    const minX = side > 0 ? SAFE_X : 0, maxX = side > 0 ? W : W - SAFE_X;   // o lado da arma fica livre de caixas
    if (bx.x - bx.size * 0.7 < minX) { bx.x = minX + bx.size * 0.7; bx.vx = Math.abs(bx.vx); }
    if (bx.x + bx.size * 0.7 > maxX) { bx.x = maxX - bx.size * 0.7; bx.vx = -Math.abs(bx.vx); }
    if (bx.vy < 0) bx.up = true;

    for (const b of bullets) {
      if (b.dead || bx.hit) continue;
      if (segDist(b.px, b.py, b.x, b.y, bx.x, bx.y) < bx.size * 0.72) {
        const sp = Math.hypot(b.vx, b.vy) || 1;
        bx.hx = b.vx / sp; bx.hy = b.vy / sp;   // direção do impacto (os pedaços voam para lá)
        b.dead = true; bx.hit = true; hitBox(bx);
        parts.push({ kind: 'ring', x: bx.x, y: bx.y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: 8,
          color: bx.type === 'bomb' ? '#ff8a5c' : '#fff3b0', rot: 0, vr: 0 });
      }
    }
    if (!bx.hit && bx.up && bx.vy > 0 && bx.y > H + bx.size + 10) {
      bx.hit = true;
      if (state === 'play' && bx.type !== 'bomb') loseLife(Math.min(Math.max(bx.x, 60), W - 60), H - 30);
    }
  }
  boxes = boxes.filter(b => !b.hit);
  if (state === 'play' && ammo <= 0 && mini <= 0 && bullets.every(b => b.dead)) endGame();

  flash = Math.max(0, flash - dt);
  boom = Math.max(0, boom - 2.2 * dt);
  comboPop = Math.max(0, comboPop - 3 * dt);
  for (const p of parts) {
    if (p.kind === 'spark') { p.vx *= 1 - 4 * dt; p.vy *= 1 - 4 * dt; }
    else if (p.kind === 'ring') p.size += (p.grow || 260) * dt;
    else if (p.kind === 'bolt') { /* parado: só desaparece */ }
    else if (p.kind === 'fire') { p.vx *= 1 - 3 * dt; p.vy = p.vy * (1 - 3 * dt) - 40 * dt; p.size += 30 * dt; }
    else if (p.kind === 'smoke') { p.vx *= 1 - 2.5 * dt; p.vy = p.vy * (1 - 2.5 * dt) - 25 * dt; p.size += 22 * dt; }
    else p.vy += GRAVITY * 0.8 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 50 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}

// raio: zigue-zague entre dois pontos
function boltPath(x1, y1, x2, y2, jitter = 22) {
  const pts = [[x1, y1]], n = 9, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  for (let i = 1; i < n; i++) {
    const o = (Math.random() - 0.5) * 2 * jitter;
    pts.push([x1 + dx * i / n + nx * o, y1 + dy * i / n + ny * o]);
  }
  pts.push([x2, y2]);
  return pts;
}
function addBolt(x1, y1, x2, y2, life = 0.4) {
  parts.push({ kind: 'bolt', x: x2, y: y2, vx: 0, vy: 0, life, max: life, size: 0, color: '#fff', rot: 0, vr: 0,
    pts: boltPath(x1, y1, x2, y2) });
}

// caixa de raio: descarrega um raio em cada caixa no ar e quebra todas a favor do jogador
function zapAll(src) {
  const targets = boxes.filter(t => t !== src && !t.hit && t.y < H - 10);
  boom = 0.8; boomRGB = '170,210,255'; shake = Math.max(shake, 16);

  burst(src.x, src.y, '#7fd0ff', 22, 460);
  for (const t of targets) {
    t.hit = true;
    addBolt(t.x + (Math.random() - 0.5) * 80, -20, t.x, t.y);   // raio caindo do céu
    addBolt(src.x, src.y, t.x, t.y, 0.3);                       // corrente a partir da caixa de raio
    parts.push({ kind: 'ring', x: t.x, y: t.y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 6, grow: 380, lw: 5, color: '#cfeaff', rot: 0, vr: 0 });
    if (t.type === 'bomb') { burst(t.x, t.y, '#7fd0ff', 16, 380); floatText(t.x, t.y, 'OK', '#9fd4ff'); }   // bomba desarmada, sem perder vida
    else { hitBox(t); burst(t.x, t.y, '#7fd0ff', 10, 380); }
  }

  beep(1400, 0.3, 'sawtooth', 0.07, -1200);
  beep(260, 0.45, 'square', 0.07, -200);
  for (let i = 0; i < 4; i++) setTimeout(() => beep(600 + Math.random() * 1200, 0.07, 'sawtooth', 0.04, -400), 40 + i * 55);
}

// caixa estilhaça em pedaços da própria textura + lascas, poeira e brilho
function shatter(bx) {
  const img = boxImgs[bx.type], c = BOX_CROPS[bx.type], N = 3, ps = bx.size / N;
  const dx = bx.hx || 0, dy = bx.hy || 0, cs = Math.cos(bx.rot), sn = Math.sin(bx.rot);
  const gold = bx.type === 'gold', bolt = bx.type === 'bolt';
  if (img && img.complete && img.naturalWidth && c) {
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const ox = (i + 0.5 - N / 2) * ps, oy = (j + 0.5 - N / 2) * ps;
      const rx = ox * cs - oy * sn, ry = ox * sn + oy * cs;    // posição do pedaço na caixa girada
      const l = 0.9 + Math.random() * 0.6;
      parts.push({ kind: 'shard', img, sx: c.x + i * c.w / N, sy: c.y + j * c.h / N, sw: c.w / N, sh: c.h / N,
        x: bx.x + rx, y: bx.y + ry, vx: rx * 7 + dx * 260 + (Math.random() - 0.5) * 140,
        vy: ry * 7 + dy * 260 - 120 + (Math.random() - 0.5) * 140,
        life: l, max: l, size: ps * 1.04, color: '#fff', rot: bx.rot, vr: (Math.random() - 0.5) * 14 });
    }
  }
  // clarão do impacto
  parts.push({ kind: 'fire', x: bx.x, y: bx.y, vx: 0, vy: 0, life: 0.14, max: 0.14, size: bx.size * 0.9, color: '#ffffff', rot: 0, vr: 0 });
  // lascas / faíscas
  const col = gold ? ['#fff3b0', '#ffd23f'] : bx.type === 'minigun' ? ['#e0b8ff', '#9b4dff'] : bolt ? ['#7fd0ff', '#ffffff'] : ['#e3b27a', '#a8703a'];
  for (let i = 0; i < (gold || bolt || bx.type === 'minigun' ? 16 : 12); i++) {
    const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 2.4, sp = 200 + Math.random() * 520, l = 0.25 + Math.random() * 0.3;
    parts.push({ kind: 'spark', x: bx.x, y: bx.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: l, max: l,
      size: 2 + Math.random() * 2.5, color: col[i % 2], rot: 0, vr: 0 });
  }
  // poeira
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 120, l = 0.5 + Math.random() * 0.4;
    parts.push({ kind: 'smoke', x: bx.x, y: bx.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: l, max: l,
      size: 8 + Math.random() * 8, color: gold ? '#ffe9a0' : bx.type === 'minigun' ? '#c9a0ff' : bolt ? '#9fc8ff' : '#d9c7a3', rot: 0, vr: 0 });
  }
  // moedinhas douradas voando
  if (gold) for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2, sp = 200 + Math.random() * 300;
    parts.push({ x: bx.x, y: bx.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, max: 1, size: 7,
      color: '#ffd23f', rot: 0, vr: 10 });
  }
  shake = Math.max(shake, gold ? 6 : 4);
}

function hitBox(bx) {
  if (ammo < MAX_AMMO && mini <= 0) ammo++;     // acertou qualquer caixa: recupera 1 bala
  if (bx.type === 'bomb') {
    combo = 0;
    explode(bx.x, bx.y);
    loseLife(bx.x, bx.y);
    return;
  }
  combo++; comboPop = 1;
  kills++;
  const base = bx.type === 'gold' ? 50 : bx.type === 'minigun' ? 30 : bx.type === 'bolt' ? 20 : 10;
  const coins = COIN_VALUE[bx.type];
  addCoins(coins);
  floatText(bx.x, bx.y + 22, '+' + coins + '¢', '#ffd23f');
  const pts = base * (1 + Math.floor(combo / 3));
  score += pts;
  shatter(bx);
  floatText(bx.x, bx.y, '+' + pts + (combo >= 3 ? '  x' + (1 + Math.floor(combo / 3)) : ''), '#fff');
  sfxBreak(bx.type);
  beep(520 + Math.min(combo, 12) * 40, 0.12, 'triangle', 0.05, 0, 0.04);   // tom sobe com o combo
  if (bx.type === 'gold') {
    if (mini <= 0) {
      ammo = Math.min(ammo + 1, BONUS_CAP);
      floatText(bx.x, bx.y + 44, T().bullet, '#ffd76a');
    }
  }
  if (bx.type === 'gold' && lives < 7 && Math.random() < 0.5) {
    lives++; floatText(bx.x, bx.y - 22, '+1 ♥', '#6dff9a');
  }
  shake = Math.max(shake, 4);
  if (bx.type === 'bolt') zapAll(bx);
  if (bx.type === 'minigun') grantMinigun();
}

function segDist(x1, y1, x2, y2, px, py) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// barra da minigun: gradiente, marcas a cada 10 balas, rastro de dano e pulso vermelho quando está acabando
let miniGhost = 0;
function drawMiniBar() {
  const w = 210, h = 24, x = side > 0 ? 20 : W - 20 - w, y = H - 48;
  const f = mini / MINI_AMMO, low = f <= 0.3, t = performance.now() / 1000;
  if (mini > miniGhost) miniGhost = mini; else miniGhost += (mini - miniGhost) * 0.08;
  const fx = (v) => side > 0 ? x : x + w - w * v;   // lado de onde a barra esvazia
  ctx.save();
  if (low) { ctx.shadowColor = 'rgba(255,70,50,' + (0.5 + 0.5 * Math.sin(t * 10)) + ')'; ctx.shadowBlur = 16; }
  else { ctx.shadowColor = 'rgba(255,255,255,0.45)'; ctx.shadowBlur = 8; }
  ctx.fillStyle = '#12142a'; ctx.fillRect(x, y, w, h);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const gf = miniGhost / MINI_AMMO;
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(fx(gf), y, w * gf, h);   // rastro do que acabou de gastar
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (low) { g.addColorStop(0, '#ff8a6b'); g.addColorStop(1, '#d6301f'); }
  else { g.addColorStop(0, '#ffe58a'); g.addColorStop(1, '#f2a21c'); }
  ctx.fillStyle = g; ctx.fillRect(fx(f), y, w * f, h);
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(fx(f), y, w * f, h * 0.4);   // reflexo
  ctx.fillStyle = 'rgba(10,12,30,0.35)';
  for (let i = 1; i < 10; i++) ctx.fillRect(x + w * i / 10 - 1, y, 2, h);   // uma marca a cada 10 balas
  ctx.restore();
  ctx.strokeStyle = low ? '#ff9f8f' : '#ffffff'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  // rótulo e contagem
  ctx.save(); ctx.shadowColor = '#000a'; ctx.shadowBlur = 4;

// munição da pistola: cartuchos de latão com ponta de cobre; bônus ficam verdes; os gastos viram contorno vazio
function drawAmmo() {
  const n = Math.max(MAX_AMMO, ammo), cw = 11, ch = 28, gap = 5, y = H - 20 - ch;
  const low = ammo > 0 && ammo <= 2, pulse = 0.55 + 0.45 * Math.sin(performance.now() / 110);
  for (let i = 0; i < n; i++) {
    const x = side > 0 ? 20 + i * (cw + gap) : W - 20 - cw - i * (cw + gap);
    const full = i < ammo, bonus = i >= MAX_AMMO;
    const tipH = 10, bodyY = y + tipH;
    // silhueta: ponta arredondada + estojo com aro na base
    const shape = () => {
      ctx.beginPath();
      ctx.moveTo(x + 1, bodyY); ctx.quadraticCurveTo(x + 1, y + 1, x + cw / 2, y);
      ctx.quadraticCurveTo(x + cw - 1, y + 1, x + cw - 1, bodyY);
      ctx.lineTo(x + cw - 1, y + ch - 3); ctx.lineTo(x + cw, y + ch - 3); ctx.lineTo(x + cw, y + ch);
      ctx.lineTo(x, y + ch); ctx.lineTo(x, y + ch - 3); ctx.lineTo(x + 1, y + ch - 3); ctx.closePath();
    };
    if (!full) {
      shape(); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
      continue;
    }
    ctx.save();
    if (low) { ctx.shadowColor = 'rgba(255,70,50,' + pulse + ')'; ctx.shadowBlur = 10; }
    shape(); ctx.fillStyle = '#000'; ctx.fill();   // base para a sombra
    ctx.restore();
    ctx.save(); shape(); ctx.clip();
    const cg = ctx.createLinearGradient(x, 0, x + cw, 0);   // estojo: brilho vertical metálico
    if (bonus) { cg.addColorStop(0, '#1f9a57'); cg.addColorStop(0.35, '#a6ffc6'); cg.addColorStop(1, '#2fb868'); }
    else { cg.addColorStop(0, '#a8741a'); cg.addColorStop(0.35, '#ffe9a0'); cg.addColorStop(1, '#c88a1a'); }
    ctx.fillStyle = cg; ctx.fillRect(x, bodyY, cw, ch - tipH);
    const tg = ctx.createLinearGradient(x, 0, x + cw, 0);   // ponta
    if (bonus) { tg.addColorStop(0, '#2f7f55'); tg.addColorStop(0.35, '#d6ffe4'); tg.addColorStop(1, '#4fbf80'); }
    else { tg.addColorStop(0, '#8a3e18'); tg.addColorStop(0.35, '#ffb07a'); tg.addColorStop(1, '#b4551f'); }
    ctx.fillStyle = tg; ctx.fillRect(x, y, cw, tipH);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, bodyY - 1, cw, 1.5);               // junção ponta/estojo
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, y + ch - 5, cw, 1.5);                // ranhura do aro
    ctx.restore();
    shape(); ctx.strokeStyle = low ? '#ff9f8f' : 'rgba(20,12,0,0.75)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}
function drawBox(bx) {
  ctx.save();
  ctx.translate(bx.x, bx.y); ctx.rotate(bx.rot);
  const s = bx.size, h = s / 2;
  if (bx.type === 'bomb' && boxImgs.bomb.complete && boxImgs.bomb.naturalWidth) {
    const k = s / BOMB_BODY;   // corpo da bomba ocupa o mesmo espaço do círculo antigo
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(boxImgs.bomb, BOMB_CROP.x, BOMB_CROP.y, BOMB_CROP.w, BOMB_CROP.h,
      (BOMB_CROP.x - BOMB_CENTER.x) * k, (BOMB_CROP.y - BOMB_CENTER.y) * k, BOMB_CROP.w * k, BOMB_CROP.h * k);
  } else if (bx.type === 'bomb') {
    ctx.fillStyle = '#2b2b33'; ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, h, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff4d4d'; ctx.font = 'bold ' + s * 0.6 + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, 2);
  } else if (boxImgs[bx.type] && boxImgs[bx.type].complete && boxImgs[bx.type].naturalWidth) {
    ctx.imageSmoothingQuality = 'high';
    const c = BOX_CROPS[bx.type];
    if (bx.type === 'bolt') drawBoltAura(s);
    if (bx.type === 'gold') drawGoldHalo(s, bx.seed = bx.seed || Math.random() * 10);
    if (bx.type === 'minigun') drawMiniGlow(s, bx.seed = bx.seed || Math.random() * 10);
    ctx.drawImage(boxImgs[bx.type], c.x, c.y, c.w, c.h, -h, -h, s, s);
    if (bx.type === 'bolt') drawBoltArcs(s);
    if (bx.type === 'gold') drawGoldShine(s, bx.seed);
    if (bx.type === 'minigun') drawMiniShine(s, bx.seed);
  } else {
    const gold = bx.type === 'gold', bolt = bx.type === 'bolt';
    ctx.fillStyle = gold ? '#ffd23f' : bolt ? '#2f6bff' : '#c98a4b';
    ctx.strokeStyle = gold ? '#a77b00' : bolt ? '#0d2a7a' : '#6b4421'; ctx.lineWidth = 3;
    ctx.fillRect(-h, -h, s, s); ctx.strokeRect(-h, -h, s, s);
    ctx.beginPath();
    ctx.moveTo(-h, -h); ctx.lineTo(h, h); ctx.moveTo(h, -h); ctx.lineTo(-h, h);
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = gold ? '#fff3b0' : '#e3b27a';
    ctx.fillRect(-h + 3, -3, s - 6, 6);
  }
  ctx.restore();
}

const gunImg = new Image();
gunImg.src = 'images/pistola.png';     // a imagem aponta para a esquerda: é espelhada ao desenhar
const IMG_K = 0.17, IMG_PIVOT = { x: 1046, y: 240 };   // escala e ponto de giro (coords da imagem original)
const MUZZLE_X = (1046 - 235) * IMG_K, MUZZLE_Y = 0;
const revolverImg = new Image();
revolverImg.src = 'images/revolver.png';   // aponta para a esquerda: é espelhada ao desenhar
const REV_K = 0.08, REV_PIVOT = { x: 1587, y: 506 }, REV_MUZZLE_X = (1587 - 103) * REV_K;   // pivô no eixo do cano, perto do cão
// armas da loja: imagem, recorte útil (sem margem transparente), escala, ponto de giro e ponta do cano
const GUNS = {
  pistol: { img: gunImg, crop: { x: 235, y: 152, w: 871, h: 552 }, k: IMG_K, pivot: IMG_PIVOT, muzzle: MUZZLE_X },
  revolver: { img: revolverImg, crop: { x: 103, y: 306, w: 2082, h: 953 }, k: REV_K, pivot: REV_PIVOT, muzzle: REV_MUZZLE_X, spinAt: { x: 1420, y: 880 } },   // spinAt: gatilho (coords da imagem), centro da cambalhota
};
const miniImg = new Image();
miniImg.src = 'images/minigun.png';   // aponta para a esquerda: é espelhada ao desenhar
const MINI_K = 0.085, MINI_PIVOT = { x: 1728, y: 737 }, MINI_MUZZLE_X = (1728 - 64) * MINI_K;
function muzzleLen() { return mini > 0 && intro <= 0 ? MINI_MUZZLE_X : GUNS[equipped].muzzle; }   // ponta do cano em relação ao ponto de giro
let recoil = 0;
let spin = 0;                // tempo restante da cambalhota do revólver (só dá outro tiro quando acaba)
const SPIN_TIME = 0.5;
function gunY() { return GUN.y + Math.sin(performance.now() / 400) * 8; }

function drawGun() {
  const gy = gunY();
  ctx.save();
  ctx.translate(GUN.x, gy); ctx.rotate(aim);
  if (spin > 0 && !(mini > 0 && intro <= 0)) {   // cambalhota para trás, girando em volta do gatilho
    const G = GUNS[equipped], sa = G.spinAt || G.pivot;   // centro do giro: o gatilho, em coords locais (imagem espelhada)
    const cx = G.k * (G.pivot.x - sa.x), cy = side * G.k * (sa.y - G.pivot.y);
    ctx.translate(cx, cy); ctx.rotate(-side * Math.PI * 2 * smooth(1 - spin / SPIN_TIME)); ctx.translate(-cx, -cy);
  }
  ctx.translate(-recoil, 0);
  if (mini > 0 && intro <= 0 && miniImg.complete && miniImg.naturalWidth) {
    if (held && shootCd > 0) ctx.translate((Math.random() - 0.5) * 2.5, (Math.random() - 0.5) * 2.5);   // vibra ao disparar
    ctx.scale(-MINI_K, side * MINI_K);   // espelha na horizontal
    ctx.drawImage(miniImg, -MINI_PIVOT.x, -MINI_PIVOT.y);
    ctx.restore();
    recoil = Math.max(0, recoil - 80 * (1 / 60));
    return;
  }
  const G = GUNS[equipped];
  if (G.img.complete && G.img.naturalWidth) {
    ctx.scale(-G.k, side * G.k);   // espelha na horizontal
    ctx.drawImage(G.img, -G.pivot.x, -G.pivot.y);
    ctx.restore();
    recoil = Math.max(0, recoil - 80 * (1 / 60));
    return;
  }
  ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#11141f';
  // empunhadura
  ctx.fillStyle = '#6b4421';
  ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(-4, 2); ctx.lineTo(-10, 34); ctx.lineTo(-26, 34); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // guarda-mato
  ctx.beginPath(); ctx.arc(4, 8, 8, 0.2, Math.PI - 0.2); ctx.stroke();
  // corpo / ferrolho
  ctx.fillStyle = '#9aa3c7';
  ctx.beginPath(); ctx.roundRect(-24, -14, 82, 18, 4); ctx.fill(); ctx.stroke();
  // cano
  ctx.fillStyle = '#6a7298';
  ctx.fillRect(58, -10, 10, 10); ctx.strokeRect(58, -10, 10, 10);
  // detalhes
  ctx.fillStyle = '#ffd76a'; ctx.fillRect(-20, -10, 6, 10);
  ctx.fillStyle = '#4a5280'; ctx.fillRect(14, -9, 30, 3);
  ctx.restore();
  recoil = Math.max(0, recoil - 80 * (1 / 60));
}

function drawFlash() {
  if (flash <= 0) return;
  const t = flash / FLASH_TIME, m = muzzlePos();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(m.x, m.y);
  // brilho redondo
  const r = 14 + 22 * t;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, 'rgba(255,250,210,' + t + ')');
  g.addColorStop(0.45, 'rgba(255,190,70,' + 0.7 * t + ')');
  g.addColorStop(1, 'rgba(255,120,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  // língua de fogo na direção do tiro
  ctx.rotate(aim);
  ctx.fillStyle = 'rgba(255,225,130,' + (0.9 * t) + ')';
  ctx.beginPath(); ctx.moveTo(-4, -7 * t - 2); ctx.lineTo(34 * t + 14, 0); ctx.lineTo(-4, 7 * t + 2); ctx.closePath(); ctx.fill();
  // pontas em estrela
  ctx.rotate(flashRot - aim);
  ctx.fillStyle = 'rgba(255,245,200,' + (0.8 * t) + ')';
  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(r * 1.1, 0); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function text(t, x, y, size, color = '#fff', align = 'center') {
  ctx.fillStyle = color; ctx.font = 'bold ' + size + 'px "Segoe UI", sans-serif';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
}

// cena de entrada da minigun: escurece, raios de luz e a arma subindo ao centro
function drawMiniIntro() {
  const e = smooth(Math.min(1, (INTRO_TIME - intro) / 0.5)) * smooth(Math.min(1, intro / 0.5)), t = performance.now() / 1000;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,' + (0.5 * e) + ')'; ctx.fillRect(-240, -240, W + 480, H + 480);
  ctx.translate(W / 2, H / 2 - 10);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3 * e; ctx.rotate(t * 0.6); ctx.fillStyle = '#ffd76a';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(440, -26); ctx.lineTo(440, 26); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(0, 0, 20, 0, 0, 260 + Math.sin(t * 6) * 14);
  gl.addColorStop(0, 'rgba(255,215,90,' + (0.6 * e) + ')'); gl.addColorStop(1, 'rgba(255,170,30,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 280, 0, 7); ctx.fill();
  ctx.restore();
  if (miniImg.complete && miniImg.naturalWidth) {
    ctx.save();
    ctx.translate(0, (1 - e) * 70 + Math.sin(t * 3) * 4);
    const k = (400 / 2184) * (0.6 + 0.4 * e);
    ctx.globalAlpha = e; ctx.scale(-k, k);
    ctx.drawImage(miniImg, -1156, -732);   // centro da área útil da imagem
    ctx.restore();
  }
  ctx.globalAlpha = e;
  text(T().miniTitle, 0, -150, 70, '#ffd76a');
  text(T().miniAmmo, 0, 150, 34, '#fff');
  ctx.restore();
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (intro > 0) {   // a tela se afasta e volta
    const z = 1 - 0.2 * smooth(Math.min(1, (INTRO_TIME - intro) / 0.45)) * smooth(Math.min(1, intro / 0.45));
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  }
  // fundo
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'hsl(' + bgHue + ',32%,20%)'); g.addColorStop(1, 'hsl(' + bgHue + ',32%,10%)');
  ctx.fillStyle = g; ctx.fillRect(-240, -240, W + 480, H + 480);
  // quadriculado translúcido
  ctx.strokeStyle = 'rgba(159,176,255,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -GRID * 8; x <= W + GRID * 8; x += GRID) { ctx.moveTo(x + 0.5, -240); ctx.lineTo(x + 0.5, H + 240); }
  for (let y = -GRID * 8; y <= H + GRID * 8; y += GRID) { ctx.moveTo(-240, y + 0.5); ctx.lineTo(W + 240, y + 0.5); }
  ctx.stroke();

  // linha de mira
  if (state === 'play') {
    ctx.setLineDash([6, 10]); ctx.strokeStyle = '#ffffff30'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(GUN.x + Math.cos(aim) * (muzzleLen() + 8), gunY() + Math.sin(aim) * (muzzleLen() + 8));
    ctx.lineTo(GUN.x + Math.cos(aim) * 1400, gunY() + Math.sin(aim) * 1400); ctx.stroke();
    ctx.setLineDash([]);
  }

  // pontos grandes e transparentes no meio da tela (atrás das caixas)
  if (state === 'play' || state === 'pause') {
    ctx.globalAlpha = 0.2;
    const shrink = Math.min(1, (score - shownScore) / 200);   // 0 = alcançou, 1 = falta muito
    const k = 1 - 0.25 * shrink;                               // encolhe quando falta muito, volta ao normal ao alcançar
    const dx = shrink * (24 + 12 * Math.sin(performance.now() / 40));   // desliza para o lado e balança enquanto conta
    text(fmt(Math.floor(shownScore)), W / 2 + dx, H / 2, 200 * k, '#fff');
    text(T().points, W / 2, H / 2 + 120, 28, '#fff');
    ctx.globalAlpha = 1;
  }

  boxes.forEach(drawBox);
  drawGun();
  drawFlash();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const b of bullets) {
    const sp = Math.hypot(b.vx, b.vy), dx = b.vx / sp, dy = b.vy / sp;
    const len = Math.min(130, Math.hypot(b.x - b.sx, b.y - b.sy) + 20);   // rastro cresce a partir do cano
    const tx = b.x - dx * len, ty = b.y - dy * len;
    // rastro com degradê (laranja -> branco quente)
    const g = ctx.createLinearGradient(tx, ty, b.x, b.y);
    g.addColorStop(0, 'rgba(255,120,30,0)');
    g.addColorStop(0.6, 'rgba(255,190,70,0.55)');
    g.addColorStop(1, 'rgba(255,255,230,1)');
    ctx.strokeStyle = g; ctx.lineWidth = 7; ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();      // brilho externo
    ctx.lineWidth = 3; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();      // núcleo
    // cabeça brilhante
    const hg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 11);
    hg.addColorStop(0, 'rgba(255,255,255,1)');
    hg.addColorStop(0.4, 'rgba(255,220,120,0.6)');
    hg.addColorStop(1, 'rgba(255,160,40,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill();
  }
  ctx.restore();
  for (const p of parts) {
    if (p.kind === 'spark') {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    if (p.kind === 'ring') {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.strokeStyle = p.color; ctx.lineWidth = (p.lw || 4) * (p.life / p.max) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    if (p.kind === 'shard') {
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / (p.max * 0.4));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.drawImage(p.img, p.sx, p.sy, p.sw, p.sh, -p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore(); continue;
    }
    if (p.kind === 'bolt') {
      const a = Math.max(0, p.life / p.max);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.globalAlpha = Math.min(1, a * (0.6 + Math.random() * 0.6));   // pisca
      for (const [lw, col] of [[14, 'rgba(70,140,255,0.45)'], [6, '#7fd0ff'], [2.5, '#ffffff']]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.beginPath(); p.pts.forEach((q, j) => j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke();
      }
      ctx.restore(); continue;
    }
    if (p.kind === 'fire') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.9;
      const fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      fg.addColorStop(0, '#fff8d0'); fg.addColorStop(0.4, p.color); fg.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
      ctx.restore(); continue;
    }
    if (p.kind === 'smoke') {
      ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.35;
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
      ctx.globalAlpha = 1; continue;
    }
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life / 0.8);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    text(f.text, f.x, f.y, 22, f.color);
    ctx.globalAlpha = 1;
  }

  // HUD
  if (state === 'play' || state === 'pause' || state === 'over') {
    text(T().level + ' ' + level, W / 2, 28, 20, '#9fb0ff');
    text(T().coins + ': ' + money(runCoins), W - 20, 62, 20, '#ffd23f', 'right');
    text('♥'.repeat(Math.max(lives, 0)), W - 20, 28, 26, '#ff5d6c', 'right');
    if (mini > 0) drawMiniBar();   // barra de balas da minigun
    else drawAmmo();
    if (combo >= 2) {   // aparece a cada acerto seguido, com um "pulo" a cada +1
      ctx.save(); ctx.translate(20, 78); ctx.scale(1 + 0.45 * comboPop, 1 + 0.45 * comboPop);
      const mult = 1 + Math.floor(combo / 3);
      text(T().combo + ' ' + combo + '!', 0, 0, 30, comboPop > 0.5 ? '#fff' : '#ffd76a', 'left');
      if (mult > 1) text('x' + mult, 0, 28, 20, '#ff9f43', 'left');
      ctx.restore();
    }
  }

  if (state !== 'play') drawScreen();
  text('v0.3.3 Beta', 14, 16, 13, 'rgba(255,255,255,0.55)', 'left');   // versão
  if (intro > 0) drawMiniIntro();
  if (boom > 0) {   // clarão da explosão por cima de tudo
    ctx.fillStyle = 'rgba(' + boomRGB + ',' + (0.55 * boom) + ')'; ctx.fillRect(-240, -240, W + 480, H + 480);
  }
  ctx.restore();
}

// ---------- menus ----------
const BTN_W = 280, BTN_H = 52;
function buttons() {
  const list = {
    menu: [
      { label: T().howto, act: () => state = 'help', x: (W - 150) / 2, y: 282, w: 150, h: 30, small: true, fs: 14 },
      { label: T().play, act: startGame, x: (W - BTN_W) / 2, y: 322 },
      { label: T().shop, act: () => state = 'shop', x: (W - 200) / 2, y: 388, w: 200 },
      { label: T().settings, act: () => state = 'settings', x: W - 14 - 44, y: 14, w: 44, h: 44, icon: 'gear' },
    ],
    shop: [
      ...shopCards().map(c => c.button),
      { label: T().back, act: () => state = 'menu', x: (W - BTN_W) / 2, y: 450 },
    ],
    settings: [
      { label: T().sound + ': ' + (soundOn ? T().on : T().off), act: () => setSound(!soundOn) },
      { label: T().lang + ': ' + T().langName, act: () => setLang(lang === 'pt' ? 'en' : 'pt') },
      { label: T().side + ': ' + (side > 0 ? T().left : T().right), act: () => setSide(-side) },
      { label: T().back, act: () => state = 'menu' },
    ],
    help: [{ label: T().back, act: () => state = 'menu' }],
    pause: [
      { label: T().resume, act: () => state = 'play' },
      { label: T().menu, act: toMenu },
    ],
    over: [
      { label: T().again, act: startGame },
      { label: T().menu, act: toMenu },
    ],
  }[state] || [];
  const top = { menu: 0, help: 450, settings: 170, shop: 450, pause: 250, over: 340 }[state];
  const gap = 68;
  list.forEach((b, i) => { if (b.x === undefined) { b.x = (W - BTN_W) / 2; b.y = top + i * gap; } });
  return list;
}
function startGame() { reset(); state = 'play'; }
function toMenu() { reset(); state = 'menu'; spawnTimer = 0.3; }
function hoverBtn() {
  return buttons().find(b => !b.disabled && mouse.x >= b.x && mouse.x <= b.x + (b.w || BTN_W) && mouse.y >= b.y && mouse.y <= b.y + (b.h || BTN_H));
}

// ---------- cartões de recorde / carteira ----------
function drawTrophy(x, y, k, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = color; ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(-11, -5, 6, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(11, -5, 6, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(10, -14); ctx.lineTo(8, 0);
  ctx.quadraticCurveTo(0, 8, -8, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(-2, 3, 4, 7); ctx.fillRect(-7, 10, 14, 4); ctx.strokeRect(-7, 10, 14, 4);
  ctx.fillStyle = '#fff8'; ctx.fillRect(-6, -12, 3, 9);
  ctx.restore();
}
function drawCoin(x, y, k, color) {
  const w = 0.25 + 0.75 * Math.abs(Math.cos(performance.now() / 500));   // moeda girando
  ctx.save(); ctx.translate(x, y); ctx.scale(k * w, k);
  ctx.fillStyle = color; ctx.strokeStyle = '#a77b00'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffffff90'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.stroke();
  ctx.fillStyle = '#8a6200'; ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('¢', 0, 1);
  ctx.restore();
}
function drawStat(cx, y, kind, label, value, color, sub) {
  const w = 210, h = 52, x = cx - w / 2, t = performance.now() / 1000;
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 14 + Math.sin(t * 3) * 6;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#3b4170'); g.addColorStop(1, '#1b1f3d');
  ctx.fillStyle = g; ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.restore();
  const bob = Math.sin(t * 3) * 1.5;
  if (kind === 'trophy') drawTrophy(x + 29, y + h / 2 + bob, 1, color);
  else drawCoin(x + 29, y + h / 2 + bob, 1, color);
  text(label.toUpperCase(), x + 56, y + 14, 12, color, 'left');
  if (sub) text(sub, x + w - 10, y + 14, 12, color, 'right');
  let size = 24;
  ctx.font = 'bold ' + size + 'px "Segoe UI", sans-serif';
  const room = w - 56 - 10, mw = ctx.measureText(value).width;
  if (mw > room) size = Math.floor(size * room / mw);
  text(value, x + 56, y + h / 2+ 9, size, '#fff', 'left');
}
function drawStats(y, sub) {
  drawStat(W / 2 - 115, y, 'trophy', T().best, fmt(best), '#ffd76a', sub && sub.best);
  drawStat(W / 2 + 115, y, 'coin', T().wallet, money(wallet), '#ffd23f', sub && sub.wallet);
}

// ---------- loja ----------
function itemState(it) {
  if (owned.includes(it.id)) return equipped === it.id ? 'equipped' : 'owned';
  if (best < it.minBest) return 'locked';
  if (wallet < it.price) return 'poor';
  return 'buyable';
}
function buyItem(it) {
  if (itemState(it) !== 'buyable') return;
  wallet -= it.price; owned.push(it.id); equipped = it.id;
  try { localStorage.setItem('stb_wallet', wallet); } catch (e) {}
  saveShop();
  [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.14, 'triangle', 0.07, 0, i * 0.07, 0.2));
}
// cartões da loja (posição + botão de cada item); cresce sozinho se entrarem mais itens
function shopCards() {
  const n = ITEMS.length, gap = n <= 3 ? 30 : 16;
  const cw = Math.min(260, Math.floor((W - 40 - (n - 1) * gap) / n)), ch = 240, y = 165;
  const x0 = (W - (n * cw + (n - 1) * gap)) / 2;
  return ITEMS.map((it, i) => {
    const x = x0 + i * (cw + gap), st = itemState(it);
    const label = { equipped: T().equipped, owned: T().equip, locked: T().locked, poor: T().buy, buyable: T().buy }[st];
    const act = st === 'owned' ? () => { equipped = it.id; saveShop(); beep(660, 0.08, 'triangle', 0.06); } : () => buyItem(it);
    return { it, st, x, y, w: cw, h: ch,
      button: { label, act, disabled: st === 'equipped' || st === 'locked' || st === 'poor', x: x + 20, y: y + ch - 54, w: cw - 40, h: 40, small: true, state: st } };
  });
}
function drawShopCards() {
  for (const c of shopCards()) {
    const { it, st, x, y, w, h } = c, locked = st === 'locked', col = st === 'equipped' ? '#6dff9a' : locked ? '#6b6f8f' : '#ffd76a';
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = locked ? 0 : 12;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#3b4170'); g.addColorStop(1, '#1b1f3d');
    ctx.fillStyle = g; ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();
    // arma
    const G = GUNS[it.id], k = Math.min((w - 50) / G.crop.w, 80 / G.crop.h);
    if (G.img.complete && G.img.naturalWidth) {
      ctx.save(); ctx.globalAlpha = locked ? 0.35 : 1; ctx.imageSmoothingQuality = 'high';
      const dw = G.crop.w * k, dh = G.crop.h * k;
      ctx.drawImage(G.img, G.crop.x, G.crop.y, G.crop.w, G.crop.h, x + (w - dw) / 2, y + 14 + (80 - dh) / 2, dw, dh);
      ctx.restore();
    }
    if (locked) text('🔒', x + w / 2, y + 54, 34, '#fff');
    text(T()[it.id + 'Name'], x + w / 2, y + 120, 22, locked ? '#9aa0c8' : '#fff');
    // preço / requisito
    if (st === 'owned' || st === 'equipped') text(it.price ? '✓' : T().free, x + w / 2, y + 148, 16, '#6dff9a');
    else {
      text(money(it.price), x + w / 2, y + 146, 20, '#ffd23f');
      if (locked) text(T().needBest + fmt(it.minBest), x + w / 2, y + 170, 14, '#ff7b7b');
      else if (st === 'poor') text(T().noCoins, x + w / 2, y + 170, 14, '#ff7b7b');
    }
  }
}
// engrenagem das configurações: 8 dentes e furo no meio
function drawGear(cx, cy, r, color, rot = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    for (const [da, rr] of [[-0.24, 0.72], [-0.15, 1], [0.15, 1], [0.24, 0.72]]) {
      const x = Math.cos(a + da) * r * rr, y = Math.sin(a + da) * r * rr;
      k === 0 && da === -0.24 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
  ctx.moveTo(r * 0.34, 0); ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2, true);
  ctx.fillStyle = color; ctx.fill('evenodd');
  ctx.restore();
}
function drawScreen() {
  ctx.fillStyle = state === 'menu' ? '#0006' : '#000b'; ctx.fillRect(-40, -40, W + 80, H + 80);
  if (state === 'menu') {
    const bob = Math.sin(performance.now() / 500) * 5;
    const tg = ctx.createLinearGradient(0, 70 + bob, 0, 170 + bob);   // degradê azulado do título
    tg.addColorStop(0, '#4d5992'); tg.addColorStop(1, '#1b1f3d');   // mesmo fundo do cartão de recorde
    text('ABSAL', W / 2, 120 + bob, 100, tg);
    const og = ctx.createLinearGradient(0, 70 + bob, 0, 170 + bob);
    og.addColorStop(0, '#b4c8e6'); og.addColorStop(1, '#5578b8');
    ctx.strokeStyle = og; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeText('ABSAL', W / 2, 120 + bob);   // contorno para destacar do fundo
    drawStats(210);
  } else if (state === 'settings') {
    text(T().settings, W / 2, 80, 46, '#ffd76a');
  } else if (state === 'shop') {
    text(T().shop, W / 2, 50, 46, '#ffd76a');
    drawStats(88);
    drawShopCards();
  } else if (state === 'help') {
    text(T().howto, W / 2, 60, 46, '#ffd76a');
    const L = T().help;
    L.forEach((l, i) => text(l[0], W / 2, 108 + i * 33, 21, l[1]));
  } else if (state === 'pause') {
    text(T().paused, W / 2, 160, 60, '#fff');
  } else if (state === 'over') {
    text(T().gameOver, W / 2, 130, 60, '#ff5d6c');
    text(T().score + ': ' + fmt(score), W / 2, 185, 32);
    drawStats(225, { best: score >= best && score > 0 ? T().newBest : '', wallet: '+' + money(runCoins) });
  }
  const hv = hoverBtn();
  for (const b of buttons()) {
    const on = !!hv && hv.x === b.x && hv.y === b.y;
    const bw = b.w || BTN_W, bh = b.h || BTN_H;
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + bh);
    if (b.disabled) { bg.addColorStop(0, b.state === 'equipped' ? '#2a6b46' : '#2b2f4d'); bg.addColorStop(1, b.state === 'equipped' ? '#174a2e' : '#1b1e36'); }
    else if (on) { bg.addColorStop(0, '#a8dcf5'); bg.addColorStop(1, '#3f93e0'); }
    else { bg.addColorStop(0, '#3b4170'); bg.addColorStop(1, '#1b1f3d'); }   // mesmo fundo do cartão de recorde
    ctx.fillStyle = bg;
    ctx.strokeStyle = b.disabled ? (b.state === 'equipped' ? '#6dff9a' : '#4a4f78') : on ? '#fff' : '#6f98d8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, bw, bh, 10); ctx.fill(); ctx.stroke();
    if (b.icon === 'gear') { drawGear(b.x + bw / 2, b.y + bh / 2, 15, on ? '#10204a' : '#cfe0ff', on ? performance.now() / 1200 : 0); continue; }
    text(b.label, b.x + bw / 2, b.y + bh / 2 + 1, b.fs || (b.small ? 18 : 22), b.disabled ? (b.state === 'equipped' ? '#6dff9a' : '#7b80a8') : on ? '#10204a' : '#fff');
  }
  cv.style.cursor = hv ? 'pointer' : 'default';
}

// ---------- entrada ----------
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('pointermove', setMouse);
cv.addEventListener('pointerdown', e => {
  setMouse(e);
  if (state === 'play') { held = true; shoot(); return; }
  const b = hoverBtn();
  if (b) { beep(440, 0.08, 'triangle', 0.06); b.act(); }
});
addEventListener('pointerup', () => held = false);
function togglePause() {
  if (state === 'play') { state = 'pause'; held = false; }
  else if (state === 'pause') state = 'play';
  else if (state === 'help' || state === 'settings' || state === 'shop') state = 'menu';
}
addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'play') { held = true; shoot(); }
    else if (state === 'menu' || state === 'over') startGame();
    else if (state === 'pause') state = 'play';
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') held = false; });
addEventListener('blur', () => { if (state === 'play') togglePause(); });

// ---------- loop ----------
reset();
let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  if (state !== 'pause') update(dt);
  if (state === 'play') cv.style.cursor = 'crosshair';
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
